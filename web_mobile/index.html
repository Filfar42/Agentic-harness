<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11181b">
<!-- Senza, su iOS i controlli nativi (cursore del textarea, barre di
     scorrimento) restano in schema chiaro sopra un fondo scuro. -->
<meta name="color-scheme" content="dark">
<title>Harness Mobile</title>
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<!-- Icona per "Aggiungi a Home" su iOS: deve stare nella root servita. -->
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Harness">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Il manifest non contiene credenziali; l’accesso usa il browser associato. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/comune/passi.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Elenco conversazioni -->
<div id="view-list" class="view">
  <header class="topbar">
    <h1>Chat</h1>
    <button id="btn-new" class="icon-btn" title="Nuova chat">+</button>
  </header>
  <div id="conn-banner" class="banner hidden"></div>
  <!-- Un solo scorrimento per due elenchi: prima i progetti, ognuno con le
       sue chat a richiesta e la sua memoria in sola lettura, poi le
       conversazioni libere. -->
  <div id="elenco" class="elenco">
    <div id="progetti-mobile" class="progetti-mobile"></div>
    <div id="libere-titolo" class="gruppo-titolo hidden">Conversazioni</div>
    <ul id="session-list" class="session-list"></ul>
  </div>
</div>

<!-- La memoria di un progetto: si legge dal telefono, si scrive dal desktop. -->
<div id="memoria-foglio" class="memoria-foglio hidden" role="dialog" aria-modal="true" aria-labelledby="memoria-titolo">
  <div class="memoria-pannello">
    <div class="memoria-testa">
      <div><b id="memoria-titolo">Memoria</b><span id="memoria-conto"></span></div>
      <button id="memoria-chiudi" class="icon-btn" type="button" title="Chiudi" aria-label="Chiudi">&#10005;</button>
    </div>
    <div id="memoria-elenco" class="memoria-elenco"></div>
  </div>
</div>

<!-- Conversazione -->
<div id="view-chat" class="view hidden">
  <header class="topbar">
    <button id="btn-back" class="icon-btn" title="Torna all'elenco">&#8592;</button>
    <div class="chat-head">
      <h1 id="chat-title">…</h1>
      <!-- Modello e workspace della chat: solo lettura. Su un telefono non
           c'e' posto per dei selettori, e la scelta resta al desktop. -->
      <div class="chat-meta">
        <!-- Il progetto della chat: toccandolo si legge la sua memoria. -->
        <button id="chat-progetto" class="chat-progetto" type="button" hidden></button>
        <span id="chat-model"></span>
        <span class="meta-sep" hidden>·</span>
        <span id="chat-workspace"></span>
      </div>
    </div>
    <!-- Velocita' del modello: dal vivo mentre genera, la media dell'ultimo
         turno a riposo. Toccandola dice anche contesto, cache e draft. -->
    <button id="goccia-tok" class="goccia-tok hidden" type="button" title="Velocità di generazione">
      <i aria-hidden="true"></i><b id="goccia-tok-v">—</b><span>tok/s</span>
    </button>
    <button id="btn-refresh" class="icon-btn" title="Ricarica">&#8635;</button>
  </header>

  <!-- Quanto e' pieno il contesto: una riga sola, sotto la barra. Si tinge
       sopra il 70% e sopra il 90%, come la barra del desktop. -->
  <div id="barra-contesto" class="barra-contesto" role="img" aria-label="Contesto">
    <span id="barra-contesto-fill"></span>
  </div>

  <div class="messages-wrap" id="messages-wrap">
    <main id="messages" class="messages"></main>
    <!-- Il piano come una rotaia: un pallino per punto, pieno se fatto, che
         pulsa se e' in corso, ambra se saltato. La linea si riempie fino
         all'ultimo punto chiuso. Toccandola si apre l'elenco. -->
    <button id="rotaia-piano" class="rotaia hidden" type="button" aria-label="Piano di lavoro">
      <span class="rotaia-linea"><span id="rotaia-fatto" class="rotaia-fatto"></span></span>
      <span id="rotaia-punti" class="rotaia-punti"></span>
    </button>
    <div id="piano-foglio" class="piano-foglio hidden" role="dialog" aria-label="Piano">
      <div class="piano-testa"><b>Piano</b><span id="piano-conto"></span></div>
      <ol id="piano-elenco" class="piano-elenco"></ol>
    </div>
  </div>

  <!-- Sta lavorando: una riga sola, animata, appiccicata sopra il composer.
       E' la risposta alla domanda che ci si fa guardando il telefono ("sta
       ancora lavorando o si e' piantato?"), e per questo dice anche da quanto.
       aria-live: chi usa VoiceOver sente cambiare l'attivita' senza toccare. -->
  <div id="attivita" class="attivita hidden" aria-live="polite">
    <span class="battito" aria-hidden="true"></span>
    <span id="attivita-testo" class="attivita-testo">sta lavorando</span>
    <span id="attivita-tempo" class="attivita-tempo"></span>
  </div>

  <!-- Card per rispondere a una domanda dell'agente (ask-user-question) -->
  <div id="question-card" class="question-card hidden">
    <div class="question-text" id="question-text"></div>
    <div id="question-options" class="question-options"></div>
    <textarea id="answer-input" rows="2" placeholder="La tua risposta…"></textarea>
    <button id="btn-answer" class="primary">Rispondi</button>
  </div>

  <footer class="composer">
    <textarea id="prompt-input" rows="1" placeholder="Messaggio al modello…"></textarea>
    <button id="btn-send" class="send" title="Invia">&#10148;</button>
    <button id="btn-stop" class="stop hidden" title="Ferma il turno">&#9632;</button>
  </footer>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/comune/passi.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
